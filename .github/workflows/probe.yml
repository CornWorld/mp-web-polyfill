name: Probe(小程序真机/DevTools 一致性探针)

# C 层验收:同一份 fixture 语义在真实小程序运行时(官方 AppService)里复跑。
# PR 不在 GitHub 托管 runner 上跑(DevTools 需要扫码登录态),本 workflow
# 挂在常驻登录态的 self-hosted Mac runner 上;官方 minium(Python)与
# miniprogram-automator(JS)驱动同一 DevTools 自动化端口,本仓库选 automator
# 复用工具链;mock 能力(mockWxMethod 结果替换语义)留给业务层桩,传输验证
# 走真实网络与 evaluate 函数体接管(见 tools/probe/run.mjs 的 hijack 检查)。
#
# 触发形态:
# - workflow_call:被业务仓库(宿主小程序工程)调用 —— 探针跑在
#   「polyfill@main + 调用方指定 ref」组合上,是业务仓库 push/PR 的真环境门禁;
# - workflow_dispatch / schedule:runner 侧配置 PROBE_PROJECT(+ 可选
#   PROBE_PAGE)环境变量指向本地小程序工程绝对路径,两者皆缺时中性跳过。
#
# checkout 布局刻意复刻 jgst 的 link: 相对路径(miniapp/package.json 的
# link:../../mp-web-polyfill):
#   $WORKSPACE/mp-web-polyfill   ← 本仓库(或 workflow_call 调用方指定的 ref)
#   $WORKSPACE/<project-repository>/miniapp     ← 宿主工程
# 真机接入位:检查全部经探针页契约(__mpProbeRun)与 evaluate 注入执行,
# 控制通道与页面解耦 —— 换真机通道(minium 真机调试)时 runner 适配层替换,
# 检查体零改动。

on:
  workflow_call:
    inputs:
      project-repository:
        description: 宿主小程序仓库 slug(owner/repo,需本 runner 可读)
        required: false
        type: string
      project-ref:
        description: 宿主仓库 checkout ref(调用方传 PR head 或分支)
        required: false
        type: string
      project-subdir:
        description: 小程序工程在宿主仓库内的子目录(含 project.config.json)
        required: false
        type: string
        default: miniapp
      probe-page:
        description: 探针页路径
        required: false
        type: string
        default: pages/probe/probe
      ws-port:
        description: CI 专用自动化端口(与本地常驻实例 9420 隔离)
        required: false
        type: string
        default: '9421'
      runs-on:
        description: runner 标签(需已安装微信开发者工具并登录)
        required: false
        type: string
        default: self-hosted
      cli-path:
        description: 微信开发者工具 cli 可执行文件路径
        required: false
        type: string
        default: /Applications/wechatwebdevtools.app/Contents/MacOS/cli
  workflow_dispatch:
    inputs:
      project-repository:
        description: 宿主小程序仓库 slug(留空则回退 runner 环境变量 PROBE_PROJECT)
        required: false
        type: string
      project-ref:
        description: 宿主仓库 checkout ref
        required: false
        type: string
        default: main
  schedule:
    - cron: '0 21 * * *' # 每日 05:00(UTC+8)冒烟,捕捉基础库/引擎行为漂移

jobs:
  probe:
    runs-on: ${{ inputs.runs-on || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: 解析宿主工程来源(仓库 or runner 本地路径)
        id: src
        run: |
          repo="${{ inputs.project-repository }}"
          if [ -z "$repo" ] && [ -n "$PROBE_PROJECT" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "path=$PROBE_PROJECT" >> "$GITHUB_OUTPUT"
          elif [ -n "$repo" ]; then
            echo "mode=repo" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 inputs.project-repository 或 runner 环境变量 PROBE_PROJECT,跳过"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Checkout 本仓库(布局对齐 link: 相对路径)'
        if: steps.src.outputs.mode != 'skip'
        uses: actions/checkout@v4
        with:
          path: mp-web-polyfill

      - name: Checkout 宿主仓库
        if: steps.src.outputs.mode == 'repo'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project-repository }}
          ref: ${{ inputs.project-ref || 'main' }}
          path: host

      - uses: pnpm/action-setup@v4
        if: steps.src.outputs.mode != 'skip'
        with:
          # checkout 布局的 workspace 根没有 package.json,action 无法自解析
          # packageManager;版本与根 package.json 的 packageManager 保持一致
          version: 10.13.1

      - uses: actions/setup-node@v4
        if: steps.src.outputs.mode != 'skip'
        with:
          node-version-file: mp-web-polyfill/.nvmrc
          cache: pnpm
          cache-dependency-path: mp-web-polyfill/pnpm-lock.yaml

      - name: 安装依赖并构建 polyfill(PR/指定 ref 代码)
        if: steps.src.outputs.mode != 'skip'
        run: |
          cd mp-web-polyfill
          pnpm install --frozen-lockfile
          pnpm build

      - name: 构建宿主小程序工程
        if: steps.src.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.src.outputs.mode }}" = "repo" ]; then
            cd "host/${{ inputs.project-subdir || 'miniapp' }}"
          else
            cd "${{ steps.src.outputs.path }}"
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          # 注意:DevTools npm 构建(miniprogram_npm)不做在这里 —— DevTools 是
          # 单实例架构,先 build-npm 后 launch 会因实例占用服务端口而失败;
          # 由探针 runner 在会话建立后经 --build-npm 路由进常驻实例执行。

      - name: 运行探针(--fresh:每轮冷启动,代码变更后常驻实例可能半编译态)
        if: steps.src.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.src.outputs.mode }}" = "repo" ]; then
            project="$GITHUB_WORKSPACE/host/${{ inputs.project-subdir || 'miniapp' }}"
          else
            project="${{ steps.src.outputs.path }}"
          fi
          cd mp-web-polyfill
          node tools/probe/run.mjs \
            --project "$project" \
            --page "${{ inputs.probe-page || env.PROBE_PAGE || 'pages/probe/probe' }}" \
            --ws "${{ inputs.ws-port || '9421' }}" \
            --cli "${{ inputs.cli-path || '/Applications/wechatwebdevtools.app/Contents/MacOS/cli' }}" \
            --build-npm \
            --fresh \
            --report probe-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: mp-web-polyfill/probe-report.json
          if-no-files-found: warn
